# CI for the Python SDK. Actions are pinned to full commit hashes (the tag is in the comment); Dependabot proposes updates.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']     # keep to releases that still receive security fixes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '${{ matrix.python }}' }
      # The shared contract (webhook signatures, retries, pagination), fetched read-only.
      - run: git clone --depth 1 https://github.com/qmgateway-sms/qmgateway-contract.git tests/contract
      - run: python -W error -m unittest discover -s tests
      - run: python -m pip install build && python -m build
