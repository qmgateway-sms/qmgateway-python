# Publishes the Python SDK to PyPI when a version tag is pushed, using PyPI TRUSTED PUBLISHING (no stored token). PyPI also stores
# signed attestations for what was published.
#
# One-time setup, by a person with MFA:
#   1. On pypi.org, add a "pending publisher" (or open the project, Publishing): owner/repository, workflow "release-pypi.yml",
#      environment "release".
#   2. On GitHub, create the protected environment "release" that needs a person's approval.
# Actions are pinned to full commit hashes (the tag is in the comment); Dependabot proposes updates.
name: Release to PyPI
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Check the tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" ] || { echo "Use an annotated, signed tag (git tag -s). Refusing to publish."; exit 1; }
          sha=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")
          ok=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags/${sha}" | jq -r '.verification.verified')
          [ "$ok" = "true" ] || { echo "GitHub does not show this tag as Verified. Refusing to publish."; exit 1; }
      - name: The changelog entry for this version is dated
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## $v " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v."; exit 1; }
          if grep -q "^## $v (unreleased)" CHANGELOG.md; then echo "Replace '(unreleased)' with the release date (YYYY-MM-DD) in CHANGELOG.md."; exit 1; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - run: git clone --depth 1 https://github.com/qmgateway-sms/qmgateway-contract.git tests/contract
      - run: python -W error -m unittest discover -s tests
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release                   # a person approves each release
    permissions:
      id-token: write                      # lets PyPI verify this exact workflow
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
